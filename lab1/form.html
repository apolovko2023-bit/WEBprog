<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Запропонувати місто — Мої 3 найкращі міста світу</title>
</head>
<body>
<header>
<h1>Мої 3 найкращі міста світу</h1>
<nav>
<a href="index.html">Головна</a> |
<a href="city-kyiv.html">Київ</a> |
<a href="city-paris.html">Париж</a> |
<a href="city-tokyo.html">Токіо</a> |
<a href="form.html">Запропонувати місто</a>
</nav>
</header>
<main>
<h2>Запропонувати місто для наступного рейтингу</h2>
<form action="form.html" method="get">
<fieldset>
<legend>Про вас</legend>
<p>
<label for="name">Ваше імʼя:</label>
<input type="text" id="name" name="name" required>
</p>
<p>
<label for="email">Email:</label>
<input type="email" id="email" name="email" required>
</p>
</fieldset>

<fieldset>
<legend>Про місто</legend>
<p>
<label for="city">Назва міста:</label>
<input type="text" id="city" name="city" required>
</p>
<p>
<label for="country">Країна:</label>
<select id="country" name="country" required>
<option value="">— оберіть країну —</option>
<option value="ukraine">Україна</option>
<option value="italy">Італія</option>
<option value="spain">Іспанія</option>
<option value="usa">США</option>
<option value="other">Інша</option>
</select>
</p>
<p>Тип пропозиції:</p>
<p>
<input type="radio" id="type-visited" name="type" value="visited" checked>
<label for="type-visited">Я вже була в цьому місті</label>
</p>
<p>
<input type="radio" id="type-dream" name="type" value="dream">
<label for="type-dream">Це місто моєї мрії</label>
</p>
<p>
<label for="visit-date">Коли відвідали/плануєте:</label>
<input type="date" id="visit-date" name="visit_date">
</p>
<p>
<label for="rating">Ваша оцінка міста (1–10):</label>
<input type="number" id="rating" name="rating" min="1" max="10">
</p>
<p>
<label for="reason">Чому варто відвідати це місто?</label><br>
<textarea id="reason" name="reason" rows="5" cols="50" required></textarea>
</p>
</fieldset>

<p>
<input type="checkbox" id="agree" name="agree" required>
<label for="agree">Погоджуюсь на обробку введених даних</label>
</p>
<p>
<button type="submit">Надіслати</button>
<button type="reset">Очистити</button>
</p>
</form>
<p><a href="index.html">← Повернутися на головну</a></p>
</main>
<footer>
<p>Автор блогу: <strong>Половко Аліна</strong>, група КН-42</p>

</footer>
</body>
</html>
